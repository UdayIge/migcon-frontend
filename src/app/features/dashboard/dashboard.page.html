<app-sidebar></app-sidebar>

<div class="topRect">
  <button class="menu-btn" (click)="sidebarSvc.toggle()">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      width="26"
      height="26"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M4 6h16M4 12h16M4 18h16"
      />
    </svg>
  </button>
  <p>{{ currentDay }}, {{ currentDate }}</p>
  <h2>Hello, User!</h2>
</div>
<div class="activeAlarms">
  <p>{{ currentMonth }}, {{ currentYear }}</p>
  <h2>Active Alarms Over Time</h2>
  <mark>
    <p style="font-weight: 800; font-size: 1.5em; align-self: flex-end">
      &nbsp; &nbsp; &nbsp;121
    </p>
    <span class="w-3 h-3 rounded-full bg-green-600 inline-block"></span>
    <span> +12.75%</span>
  </mark>
  <div class="flex justify-between items-center">
    <div class="text-right"></div>
  </div>
  <div class="lineChartCont">
    <canvas id="activeAlarmsChart"></canvas>
  </div>
</div>

<div class="chartCont">
  <div class="header">
    <p>{{ currentMonth }} {{ currentYear }}</p>
    <h2>Device Status Distribution</h2>
  </div>
  <canvas id="alarmsPieChart"></canvas>
</div>

<div class="devicesCount">
  <div class="header">
    <div>
      <p>{{ currentMonth }} {{ currentYear }}</p>
      <h2>Devices count per group</h2>
    </div>
    <select
      class="filter-btn"
      [(ngModel)]="selectedPeriod"
      (change)="onPeriodChange()"
    >
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
      <option value="yearly">Yearly</option>
    </select>
  </div>
  <div class="barChartCont">
    <canvas id="devicesBarChart"></canvas>
  </div>
</div>
